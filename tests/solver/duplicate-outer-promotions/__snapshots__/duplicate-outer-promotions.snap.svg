<svg width="960" height="1000" viewBox="0 0 960 1000" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><rect data-type="rect" data-label="" data-x="2" data-y="2" x="98.8323917137476" y="119.69868173257996" width="277.2128060263654" height="277.2128060263654" fill="rgba(59,130,246,0.35)" stroke="#2563eb" stroke-width="0.014429347826086954"/></g><g><rect data-type="rect" data-label="" data-x="2" data-y="-5" x="98.8323917137476" y="604.8210922787193" width="277.2128060263654" height="277.21280602636546" fill="rgba(239,68,68,0.35)" stroke="#dc2626" stroke-width="0.014429347826086954"/></g><g><rect data-type="rect" data-label="" data-x="9" data-y="2" x="583.9548022598871" y="119.69868173257996" width="277.21280602636534" height="277.2128060263654" fill="rgba(59,130,246,0.35)" stroke="#2563eb" stroke-width="0.014429347826086954"/></g><g><rect data-type="rect" data-label="" data-x="9" data-y="-5" x="583.9548022598871" y="604.8210922787193" width="277.21280602636534" height="277.21280602636546" fill="rgba(59,130,246,0.35)" stroke="#2563eb" stroke-width="0.014429347826086954"/></g><text data-type="text" data-label="INPUT / TOP" data-x="2" data-y="5" x="237.4387947269303" y="50.39548022598859" fill="black" font-size="20.790960451977405" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">INPUT / TOP</text><text data-type="text" data-label="1 node(s); summed area = 16" data-x="2" data-y="-0.5" x="237.4387947269303" y="431.563088512241" fill="black" font-size="17.325800376647837" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1 node(s); summed area = 16</text><text data-type="text" data-label="IDs: top" data-x="2" data-y="-1" x="237.4387947269303" y="466.21468926553666" fill="black" font-size="17.325800376647837" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">IDs: top</text><text data-type="text" data-label="INPUT / BOTTOM" data-x="2" data-y="-2" x="237.4387947269303" y="535.517890772128" fill="black" font-size="20.790960451977405" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">INPUT / BOTTOM</text><text data-type="text" data-label="1 node(s); summed area = 16" data-x="2" data-y="-7.5" x="237.4387947269303" y="916.6854990583804" fill="black" font-size="17.325800376647837" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1 node(s); summed area = 16</text><text data-type="text" data-label="IDs: bottom" data-x="2" data-y="-8" x="237.4387947269303" y="951.3370998116761" fill="black" font-size="17.325800376647837" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">IDs: bottom</text><text data-type="text" data-label="OUTPUT / TOP" data-x="9" data-y="5" x="722.5612052730697" y="50.39548022598859" fill="black" font-size="20.790960451977405" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">OUTPUT / TOP</text><text data-type="text" data-label="1 node(s); summed area = 16" data-x="9" data-y="-0.5" x="722.5612052730697" y="431.563088512241" fill="black" font-size="17.325800376647837" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1 node(s); summed area = 16</text><text data-type="text" data-label="IDs: top" data-x="9" data-y="-1" x="722.5612052730697" y="466.21468926553666" fill="black" font-size="17.325800376647837" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">IDs: top</text><text data-type="text" data-label="OUTPUT / BOTTOM" data-x="9" data-y="-2" x="722.5612052730697" y="535.517890772128" fill="black" font-size="20.790960451977405" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">OUTPUT / BOTTOM</text><text data-type="text" data-label="1 node(s); summed area = 16" data-x="9" data-y="-7.5" x="722.5612052730697" y="916.6854990583804" fill="black" font-size="17.325800376647837" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">1 node(s); summed area = 16</text><text data-type="text" data-label="IDs: top" data-x="9" data-y="-8" x="722.5612052730697" y="951.3370998116761" fill="black" font-size="17.325800376647837" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">IDs: top</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="1000" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="960" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '960');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '1000');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":69.30320150659135,"c":0,"e":98.8323917137476,"b":0,"d":-69.30320150659135,"f":396.9114877589453};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>