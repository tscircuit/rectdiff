40.8" x="799.0098556039424" y="318.1182672473069" width="360.99014439605776" height="24.066009626403684" fill="rgba(0,200,200,0.1)" stroke="#666" stroke-width="0.024931428571428573"/></g><g><rect data-type="rect" data-label="" data-x="41" data-y="40" x="799.0098556039424" y="350.20628008251197" width="360.99014439605776" height="24.066009626403684" fill="rgba(0,200,200,0.1)" stroke="#666" stroke-width="0.024931428571428573"/></g><g><rect data-type="rect" data-label="" data-x="41" data-y="39.2" x="799.0098556039424" y="382.29429291771703" width="360.99014439605776" height="24.066009626403684" fill="rgba(0,200,200,0.1)" stroke="#666" stroke-width="0.024931428571428573"/></g><g><rect data-type="rect" data-label="" data-x="41" data-y="38.4" x="799.0098556039424" y="414.3823057529223" width="360.99014439605776" height="24.066009626403684" fill="rgba(0,200,200,0.1)" stroke="#666" stroke-width="0.024931428571428573"/></g><circle data-type="circle" data-label="" data-x="20.404997829999996" data-y="39.41699889" cx="153.43906033692406" cy="385.6234687714873" r="6.016502406600962" fill="blue" stroke="blue" stroke-width="0.024931428571428573"/><text data-type="text" data-label="sample024 / MP1.4: gap-fill layer connectivity" data-x="17.6" data-y="47" x="40.9305523722212" y="81.46917258766894" fill="black" font-size="26.07151042860417" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">sample024 / MP1.4: gap-fill layer connectivity</text><text data-type="text" data-label="0 through-via regions / 8 gap nodes" data-x="17.6" data-y="45.8" x="40.9305523722212" y="129.60119184047676" fill="black" font-size="22.06050882420353" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">0 through-via regions / 8 gap nodes</text><text data-type="text" data-label="MP1.4 copper" data-x="20.7" data-y="42.4" x="165.271602108641" y="265.9752463900984" fill="black" font-size="18.049507219802887" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">MP1.4 copper</text><text data-type="text" data-label="Existing free region" data-x="28.8" data-y="41" x="490.162732065093" y="322.12926885170737" fill="black" font-size="18.049507219802887" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Existing free region</text><text data-type="text" data-label="Blue 0.3 mm via fits all 8 layers" data-x="17.6" data-y="37.8" x="40.9305523722212" y="450.4813201925281" fill="black" font-size="18.049507219802887" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Blue 0.3 mm via fits all 8 layers</text><text data-type="text" data-label="Routing regions" data-x="36.5" data-y="44.8" x="799.0098556039422" y="169.7112078844832" fill="black" font-size="18.049507219802887" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Routing regions</text><text data-type="text" data-label="availableZ: 0" data-x="41" data-y="44" x="979.5049278019712" y="201.79922071968826" fill="black" font-size="16.044006417602567" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">availableZ: 0</text><text data-type="text" data-label="availableZ: 1" data-x="41" data-y="43.2" x="979.5049278019712" y="233.8872335548931" fill="black" font-size="16.044006417602567" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">availableZ: 1</text><text data-type="text" data-label="availableZ: 2" data-x="41" data-y="42.4" x="979.5049278019712" y="265.9752463900984" fill="black" font-size="16.044006417602567" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">availableZ: 2</text><text data-type="text" data-label="availableZ: 3" data-x="41" data-y="41.6" x="979.5049278019712" y="298.06325922530345" fill="black" font-size="16.044006417602567" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">availableZ: 3</text><text data-type="text" data-label="availableZ: 4" data-x="41" data-y="40.8" x="979.5049278019712" y="330.15127206050875" fill="black" font-size="16.044006417602567" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">availableZ: 4</text><text data-type="text" data-label="availableZ: 5" data-x="41" data-y="40" x="979.5049278019712" y="362.2392848957138" fill="black" font-size="16.044006417602567" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">availableZ: 5</text><text data-type="text" data-label="availableZ: 6" data-x="41" data-y="39.2" x="979.5049278019712" y="394.3272977309189" fill="black" font-size="16.044006417602567" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">availableZ: 6</text><text data-type="text" data-label="availableZ: 7" data-x="41" data-y="38.4" x="979.5049278019712" y="426.41531056612416" fill="black" font-size="16.044006417602567" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">availableZ: 7</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="550" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '550');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":40.110016044006414,"c":0,"e":-665.0057300022918,"b":0,"d":-40.110016044006414,"f":1966.6399266559704};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>