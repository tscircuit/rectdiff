666666663" fill="#6d28d9" font-size="16.36111111111111" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">One obstacle-edge query at x = 4.85</text><text data-type="text" data-label="source" data-x="7.25" data-y="8.25" x="422.6388888888889" y="486.8055555555555" fill="black" font-size="14.777777777777779" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">source</text><text data-type="text" data-label="obstacle" data-x="7.25" data-y="7.8" x="422.6388888888889" y="510.5555555555555" fill="black" font-size="14.777777777777779" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">obstacle</text><text data-type="text" data-label="Orange: checked     Gray: skipped" data-x="7" data-y="2.35" x="409.44444444444446" y="798.1944444444443" fill="black" font-size="17.944444444444446" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Orange: checked     Gray: skipped</text><text data-type="text" data-label="Green: free gaps     Blue: seed points" data-x="7" data-y="1.7" x="409.44444444444446" y="832.5" fill="black" font-size="17.944444444444446" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Green: free gaps     Blue: seed points</text><text data-type="text" data-label="Same 3 seeds on this edge" data-x="7" data-y="0.7999999999999998" x="409.44444444444446" y="880" fill="#1d4ed8" font-size="22.694444444444443" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Same 3 seeds on this edge</text><text data-type="text" data-label="Every edge repeats the full scan" data-x="7" data-y="0.20000000000000018" x="409.44444444444446" y="911.6666666666666" fill="black" font-size="14.777777777777779" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Every edge repeats the full scan</text><text data-type="text" data-label="AFTER: query the spatial index" data-x="21.8" data-y="15.3" x="1190.5555555555557" y="114.72222222222217" fill="black" font-size="25.333333333333332" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">AFTER: query the spatial index</text><text data-type="text" data-label="2 rectangles checked for this line" data-x="21.8" data-y="14.55" x="1190.5555555555557" y="154.30555555555543" fill="#c2410c" font-size="21.111111111111114" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">2 rectangles checked for this line</text><text data-type="text" data-label="One obstacle-edge query at x = 4.85" data-x="21.8" data-y="13.7" x="1190.5555555555557" y="199.16666666666663" fill="#6d28d9" font-size="16.36111111111111" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">One obstacle-edge query at x = 4.85</text><text data-type="text" data-label="source" data-x="22.05" data-y="8.25" x="1203.75" y="486.8055555555555" fill="black" font-size="14.777777777777779" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">source</text><text data-type="text" data-label="obstacle" data-x="22.05" data-y="7.8" x="1203.75" y="510.5555555555555" fill="black" font-size="14.777777777777779" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">obstacle</text><text data-type="text" data-label="Orange: checked     Gray: skipped" data-x="21.8" data-y="2.35" x="1190.5555555555557" y="798.1944444444443" fill="black" font-size="17.944444444444446" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Orange: checked     Gray: skipped</text><text data-type="text" data-label="Green: free gaps     Blue: seed points" data-x="21.8" data-y="1.7" x="1190.5555555555557" y="832.5" fill="black" font-size="17.944444444444446" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Green: free gaps     Blue: seed points</text><text data-type="text" data-label="Same 3 seeds on this edge" data-x="21.8" data-y="0.7999999999999998" x="1190.5555555555557" y="880" fill="#1d4ed8" font-size="22.694444444444443" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Same 3 seeds on this edge</text><text data-type="text" data-label="Index built once, reused for every edge" data-x="21.8" data-y="0.20000000000000018" x="1190.5555555555557" y="911.6666666666666" fill="black" font-size="14.777777777777779" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Index built once, reused for every edge</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="1000" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1600" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1600');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '1000');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":52.77777777777778,"c":0,"e":40,"b":0,"d":-52.77777777777778,"f":922.2222222222222};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>