ill="none" stroke="#2563eb" stroke-width="4.1099404062838865"/></g><g><rect data-type="rect" data-label="void: 1.25e+1 x 4.15e-1 mm" data-x="21.5" data-y="22.985164776245952" x="151.72881986998436" y="230.7012348515725" width="493.1928487540663" height="4.877750843441845" fill="#fee2e2" stroke="#f97316" stroke-width="0.00608281325971936"/></g><g><rect data-type="rect" data-label="void: 1.20e+1 x 4.15e-1 mm" data-x="21.5" data-y="22.76276188843061" x="151.72881986998436" y="235.57898569501572" width="493.1928487540663" height="68.2472583650756" fill="#fee2e2" stroke="#f97316" stroke-width="0.00608281325971936"/></g><g><rect data-type="rect" data-label="void: 1.15e+1 x 4.47e-1 mm" data-x="21.5" data-y="22.331529092907175" x="151.72881986998436" y="303.8262440600911" width="493.1928487540663" height="73.5400289018462" fill="#fee2e2" stroke="#f97316" stroke-width="0.00608281325971936"/></g><g><rect data-type="rect" data-label="void: 1.10e+1 x 4.47e-1 mm" data-x="21.628992056933427" data-y="21.88419882998287" x="194.14079322041357" y="377.3662729619384" width="450.7808754036373" height="73.54002890184665" fill="#fee2e2" stroke="#f97316" stroke-width="0.00608281325971936"/></g><g><rect data-type="rect" data-label="void: 1.06e+1 x 4.47e-1 mm" data-x="21.86779688736582" data-y="21.436868567058575" x="272.65868296520307" y="450.9063018637853" width="372.2629856588478" height="73.5400289018462" fill="#fee2e2" stroke="#f97316" stroke-width="0.00608281325971936"/></g><g><rect data-type="rect" data-label="void: 1.01e+1 x 4.78e-1 mm" data-x="22.10660171779821" data-y="20.97439860516403" x="351.17657270999075" y="524.446330765632" width="293.74509591406013" height="78.5178897447895" fill="#fee2e2" stroke="#f97316" stroke-width="0.00608281325971936"/></g><g><rect data-type="rect" data-label="void: 9.64e+0 x 4.78e-1 mm" data-x="22.33026684926036" data-y="20.496788944299244" x="424.7166016118381" y="602.9642205104212" width="220.20506701221257" height="78.51788974478904" fill="#fee2e2" stroke="#f97316" stroke-width="0.00608281325971936"/></g><g><rect data-type="rect" data-label="void: 9.19e+0 x 4.78e-1 mm" data-x="22.55393198072251" data-y="20.128992056933427" x="498.25663051368497" y="681.4821102552098" width="146.6650381103659" height="42.41197335042898" fill="#fee2e2" stroke="#f97316" stroke-width="0.00608281325971936"/></g><text data-type="text" data-label="Board 109: 284 void rectangles" data-x="20" data-y="24.1" x="151.72881986998436" y="49.86385697508149" fill="black" font-size="19.727713950162656" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Board 109: 284 void rectangles</text><text data-type="text" data-label="0 slivers at or below EPS (1e-9 mm)" data-x="20" data-y="23.8" x="151.72881986998436" y="99.18314185048803" fill="black" font-size="19.727713950162656" font-family="sans-serif" text-anchor="start" dominant-baseline="central">0 slivers at or below EPS (1e-9 mm)</text><text data-type="text" data-label="Upper-right detail: 8 intersecting rectangles" data-x="20" data-y="23.5" x="151.72881986998436" y="148.50242672589502" fill="black" font-size="19.727713950162656" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Upper-right detail: 8 intersecting rectangles</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="800" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '800');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":164.39761625135546,"c":0,"e":-3136.2235051571247,"b":0,"d":-164.39761625135546,"f":4011.846408632748};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>